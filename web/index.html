<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多智能体旅行规划系统</title>
<style>
:root {
  --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0;
  --primary: #2563eb; --primary-soft: #dbeafe;
  --text: #0f172a; --muted: #64748b;
  --success: #16a34a; --success-soft: #dcfce7;
  --error: #dc2626; --error-soft: #fee2e2;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column;
}
header {
  padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
header h1 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
header .sub { font-size: 12px; color: var(--muted); font-weight: normal; }
#conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
#conn .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
#conn.on .dot { background: var(--success); }
#resetBtn {
  border: 1px solid var(--border); background: var(--card); color: var(--muted);
  padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
}
#resetBtn:hover { border-color: var(--primary); color: var(--primary); }

main {
  flex: 1; display: grid; grid-template-columns: minmax(340px, 5fr) 7fr;
  gap: 16px; padding: 16px 24px; min-height: 0; max-width: 1400px; width: 100%;
  margin: 0 auto;
}
@media (max-width: 900px) { main { grid-template-columns: 1fr; overflow-y: auto; } }

.panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.panel-title {
  padding: 12px 16px; font-size: 14px; font-weight: 600;
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.panel-title .badge {
  font-size: 11px; background: var(--primary-soft); color: var(--primary);
  padding: 2px 8px; border-radius: 10px; font-weight: normal;
}

/* ---------- 聊天面板 ---------- */
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: var(--radius); font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: #f8fafc; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg .caret { display: inline-block; animation: blink 1s infinite; color: var(--primary); }
@keyframes blink { 50% { opacity: 0; } }
#empty-hint { color: var(--muted); font-size: 13px; text-align: center; margin: auto; line-height: 2; }

.input-row {
  display: flex; gap: 10px; padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0;
}
#chatInput {
  flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
  font-size: 14px; outline: none; font-family: inherit;
}
#chatInput:focus { border-color: var(--primary); }
#chatInput:disabled { background: #f8fafc; color: var(--muted); }
#sendBtn {
  background: var(--primary); color: #fff; border: none; border-radius: 8px;
  padding: 0 22px; cursor: pointer; font-size: 14px;
}
#sendBtn:disabled { background: #93c5fd; cursor: not-allowed; }

/* ---------- 右侧面板 ---------- */
#rightPanel { overflow-y: auto; }
.card { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.card:last-child { border-bottom: none; }
.card h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }

/* 需求卡片 */
#prefChips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-size: 13px; padding: 5px 12px; border-radius: 16px;
  background: #f8fafc; border: 1px solid var(--border); color: var(--text);
}
.chip.pending { color: var(--muted); border-style: dashed; }
.chip .k { color: var(--muted); font-size: 11px; margin-right: 4px; }

/* 流水线时间线 */
#timeline { display: flex; flex-direction: column; gap: 4px; }
.stage { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
.stage .dot {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; background: #e2e8f0; color: var(--muted); transition: all .3s;
}
.stage.running .dot { background: var(--primary-soft); color: var(--primary); animation: pulse 1.2s infinite; }
.stage.done .dot { background: var(--success-soft); color: var(--success); }
.stage.error .dot { background: var(--error-soft); color: var(--error); }
@keyframes pulse { 50% { transform: scale(1.15); } }
.stage .label { font-size: 14px; flex: 1; }
.stage .detail { font-size: 12px; color: var(--muted); }
.stage.running .label { color: var(--primary); }

#planBtn {
  width: 100%; margin-top: 12px; background: var(--primary); color: #fff;
  border: none; border-radius: 8px; padding: 11px; font-size: 14px; cursor: pointer;
}
#planBtn:disabled { background: #cbd5e1; cursor: not-allowed; }
#planBtn.ready { animation: readyGlow 2s infinite; }
@keyframes readyGlow { 50% { box-shadow: 0 0 0 6px rgba(37,99,235,.15); } }

/* API 清单 */
.api-item { font-size: 13px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
.api-item:last-child { border-bottom: none; }
.api-item .path { font-family: Consolas, monospace; color: var(--primary); font-weight: 600; }
.api-item .method {
  font-size: 11px; background: var(--success-soft); color: var(--success);
  padding: 1px 6px; border-radius: 4px; margin-right: 6px; font-weight: 600;
}
.api-item .purpose { color: var(--muted); margin-top: 2px; }

/* 工具调用日志 */
#toolLog {
  font-family: Consolas, monospace; font-size: 12px; color: var(--muted);
  max-height: 140px; overflow-y: auto; background: #f8fafc;
  border-radius: 8px; padding: 8px 10px;
}
#toolLog div { padding: 2px 0; border-bottom: 1px dotted var(--border); }
#toolLog div:last-child { border-bottom: none; }
#toolLog .tname { color: var(--primary); font-weight: 600; }

/* 行程 */
#itineraryBody { font-size: 14px; line-height: 1.7; }
#itineraryBody h1 { font-size: 20px; margin: 8px 0 12px; color: var(--primary); }
#itineraryBody h2 {
  font-size: 16px; margin: 18px 0 8px; padding: 6px 10px;
  background: var(--primary-soft); border-radius: 6px;
}
#itineraryBody h3 { font-size: 14px; margin: 12px 0 6px; }
#itineraryBody ul { padding-left: 20px; margin: 6px 0; }
#itineraryBody li { margin: 4px 0; }
#itineraryBody p { margin: 6px 0; }
#itineraryStream {
  font-family: Consolas, monospace; font-size: 12.5px; white-space: pre-wrap;
  color: var(--text); background: #f8fafc; border-radius: 8px; padding: 12px;
  max-height: 300px; overflow-y: auto;
}
#itStreamTag { color: var(--primary); font-size: 12px; margin-bottom: 6px; display: block; }

/* toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--error); color: #fff; padding: 10px 20px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: all .3s; max-width: 80%;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>🧳 多智能体旅行规划系统
    <span class="sub">需求分析 · API 选择 · 行程规划</span>
  </h1>
  <div style="display:flex;gap:14px;align-items:center;">
    <span id="conn"><span class="dot"></span><span id="connText">连接中…</span></span>
    <button id="resetBtn" onclick="resetSession()">新会话</button>
  </div>
</header>

<main>
  <!-- 左：对话 -->
  <section class="panel">
    <div class="panel-title">💬 旅游需求分析师
      <span class="badge" id="chatBadge">收集需求中</span>
    </div>
    <div id="messages">
      <div id="empty-hint">和分析师聊聊你的旅行想法吧<br>（目的地 · 天数 · 出行方式 · 热闹/清静）</div>
    </div>
    <div class="input-row">
      <input id="chatInput" placeholder="例如：想去杭州玩3天，市内漫步，喜欢热闹…"
             onkeydown="if(event.key==='Enter')sendChat()">
      <button id="sendBtn" onclick="sendChat()">发送</button>
    </div>
  </section>

  <!-- 右：流水线 + 行程 -->
  <section class="panel" id="rightPanel">
    <div class="card">
      <h3>📋 旅游需求</h3>
      <div id="prefChips">
        <span class="chip pending"><span class="k">出发日</span>未指定</span>
        <span class="chip pending"><span class="k">城市</span>待收集</span>
        <span class="chip pending"><span class="k">天数</span>待收集</span>
        <span class="chip pending"><span class="k">出行</span>待收集</span>
        <span class="chip pending"><span class="k">氛围</span>待收集</span>
      </div>
    </div>

    <div class="card">
      <h3>⚙️ 规划流水线</h3>
      <div id="timeline">
        <div class="stage" id="stage-analyst">
          <span class="dot">1</span><span class="label">需求分析</span>
          <span class="detail" id="detail-analyst">分析师对话收集</span>
        </div>
        <div class="stage" id="stage-selector">
          <span class="dot">2</span><span class="label">API 选择（kimi-k3 思考）</span>
          <span class="detail" id="detail-selector">读取高德 API 文档</span>
        </div>
        <div class="stage" id="stage-planner">
          <span class="dot">3</span><span class="label">行程规划（调用高德接口）</span>
          <span class="detail" id="detail-planner">等待启动</span>
        </div>
      </div>
      <button id="planBtn" onclick="startPipeline()" disabled>开始规划</button>
    </div>

    <div class="card hidden" id="apiCard">
      <h3>🧭 选中的高德 API（<span id="apiCount">0</span> 个，按调用顺序）</h3>
      <div id="apiList"></div>
    </div>

    <div class="card hidden" id="toolCard">
      <h3>🔧 高德调用日志（<span id="toolCount">0</span> 次）</h3>
      <div id="toolLog"></div>
    </div>

    <div class="card hidden" id="itiCard">
      <h3>🗺️ 行程</h3>
      <div id="itineraryStream" class="hidden"></div>
      <div id="itineraryBody"></div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
// ---------- 全局状态（浏览器侧镜像） ----------
let st = {
  messages: [], preference: null, complete: false, busy: null,
  stages: {analyst: 'idle', selector: 'idle', planner: 'idle'},
  apis: [], tool_log: [], itinerary: null, itinerary_file: null,
};
let streamingBubble = null;   // 正在流式输出的助手气泡
let streamText = null;        // 流式气泡的正文 span（与光标分离，光标不会混入正文）
let lastPrefKey = '';         // 用于检测需求变化后重置流水线显示

const $ = id => document.getElementById(id);

// ---------- SSE ----------
const es = new EventSource('/api/stream');
es.onopen = () => { $('conn').classList.add('on'); $('connText').textContent = '已连接'; };
es.onerror = () => { $('conn').classList.remove('on'); $('connText').textContent = '重连中…'; };

es.addEventListener('state', e => { st = JSON.parse(e.data); renderAll(); });
es.addEventListener('chat_delta', e => {
  const {text} = JSON.parse(e.data);
  if (streamingBubble === null) {
    // 正文 span + 光标 span 分离：追加文本时光标始终在末尾，不混入正文
    streamingBubble = addBubble('assistant', '');
    streamText = document.createElement('span');
    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▍';
    streamingBubble.appendChild(streamText);
    streamingBubble.appendChild(caret);
  }
  streamText.textContent += text;
  scrollChat();
});
es.addEventListener('chat_done', e => {
  const {reply, preference} = JSON.parse(e.data);
  if (streamingBubble !== null) { streamingBubble.remove(); streamingBubble = null; streamText = null; }
  if (st.messages.length === 0 || st.messages[st.messages.length-1].role !== 'assistant'
      || st.messages[st.messages.length-1].content !== reply) {
    st.messages.push({role: 'assistant', content: reply});
  }
  st.preference = preference;
  st.complete = !!(preference && preference.success && !preference.missing_fields);
  if (st.complete) st.stages.analyst = 'done';
  renderAll(); setInputBusy(false);
});
es.addEventListener('stage', e => {
  const {stage, status, detail} = JSON.parse(e.data);
  st.stages[stage] = status;
  if (detail) $('detail-' + stage).textContent = detail;
  if (stage === 'selector' && status === 'running') $('detail-selector').textContent = '读取高德 API 文档…';
  if (stage === 'planner' && status === 'running') $('detail-planner').textContent = '收集真实数据中…';
  if (status === 'done' && stage === 'planner') $('detail-planner').textContent = '行程已生成';
  // 流水线运行期间锁定聊天输入（服务器会 409 拒绝新消息），结束后恢复
  if (status === 'running') setInputBusy(true);
  if (status === 'error' || (stage === 'planner' && status === 'done')) setInputBusy(false);
  renderAll();
});
es.addEventListener('progress', e => {
  const {detail} = JSON.parse(e.data);
  $('detail-selector').textContent = detail;
});
es.addEventListener('planner_event', e => {
  const d = JSON.parse(e.data);
  if (d.kind === 'tool') {
    st.tool_log.push({name: d.name, note: d.note});
    renderToolLog();
  } else if (d.kind === 'start') {
    $('detail-planner').textContent = `规划中（${d.tools} 个工具）`;
    showCard('toolCard');
  } else if (d.kind === 'text') {
    $('detail-planner').textContent = d.message;
  }
});
es.addEventListener('apis', e => {
  st.apis = JSON.parse(e.data).apis;
  renderApis();
});
es.addEventListener('itinerary_delta', e => {
  const {text} = JSON.parse(e.data);
  showCard('itiCard');
  const stream = $('itineraryStream');
  stream.classList.remove('hidden');
  stream.textContent += text;
  stream.scrollTop = stream.scrollHeight;
});
es.addEventListener('itinerary', e => {
  const {markdown, file} = JSON.parse(e.data);
  st.itinerary = markdown; st.itinerary_file = file;
  $('itineraryStream').classList.add('hidden');
  $('itineraryBody').innerHTML = renderMD(markdown);
  showCard('itiCard');
});
es.addEventListener('error', e => {
  // 流式输出中途出错：保留已生成的部分文本（去掉光标），再提示错误
  if (streamingBubble !== null) {
    const partial = streamText ? streamText.textContent : '';
    streamingBubble.remove();
    streamingBubble = null; streamText = null;
    if (partial) {
      st.messages.push({role: 'assistant', content: partial});
      renderMessages();
    }
  }
  try { toast(JSON.parse(e.data).message); } catch { toast('发生未知错误'); }
  setInputBusy(false);
});

// ---------- 动作 ----------
async function sendChat() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text || st.busy === 'chat') return;
  input.value = '';
  st.messages.push({role: 'user', content: text});
  renderMessages();
  setInputBusy(true);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      if (r.status === 409) {
        // 服务器正忙没接受这条消息：撤回本地预添加的气泡，恢复输入
        st.messages.pop();
        renderMessages();
        input.value = text;
      }
      toast(err.error || '发送失败');
      setInputBusy(false);
    }
  } catch (err) { toast('网络错误：' + err.message); setInputBusy(false); }
}

async function startPipeline() {
  if (!st.complete || st.busy) return;
  try {
    const r = await fetch('/api/pipeline', {method: 'POST'});
    if (!r.ok) { const e = await r.json(); toast(e.error || '启动失败'); }
  } catch (err) { toast('网络错误：' + err.message); }
}

async function resetSession() {
  if (st.busy) { toast('系统正忙，请稍候'); return; }
  if (!confirm('开始一次全新的需求收集？当前对话将不再保留（行程文件仍在磁盘）。')) return;
  await fetch('/api/reset', {method: 'POST'});
}

function setInputBusy(busy) {
  $('chatInput').disabled = busy;
  $('sendBtn').disabled = busy;
  if (!busy) $('chatInput').focus();
  renderPlanBtn();
}

// ---------- 渲染 ----------
function renderAll() {
  renderMessages(); renderChips(); renderStages();
  renderApis(); renderToolLog(); renderItinerary(); renderPlanBtn();
}

function renderMessages() {
  const box = $('messages');
  box.innerHTML = '';
  if (!st.messages.length) {
    box.innerHTML = '<div id="empty-hint">和分析师聊聊你的旅行想法吧<br>（目的地 · 天数 · 出行方式 · 热闹/清静）</div>';
    return;
  }
  for (const m of st.messages) addBubble(m.role, m.content);
  scrollChat();
}

function addBubble(role, content) {
  const hint = $('empty-hint'); if (hint) hint.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;
  $('messages').appendChild(div);
  return div;
}

function scrollChat() { const box = $('messages'); box.scrollTop = box.scrollHeight; }

const PREF_FIELDS = [
  ['start_date', '出发日'], ['city', '城市'], ['days', '天数'],
  ['travel_mode', '出行'], ['atmosphere', '氛围'],
];
function renderChips() {
  const box = $('prefChips');
  box.innerHTML = '';
  for (const [key, label] of PREF_FIELDS) {
    const val = st.preference ? st.preference[key] : null;
    const span = document.createElement('span');
    span.className = 'chip' + (val ? '' : ' pending');
    span.innerHTML = `<span class="k">${label}</span>`;
    span.appendChild(document.createTextNode(val || '待收集'));
    box.appendChild(span);
  }
  // 需求变化后重置下游展示（重新规划场景）
  const key = st.complete ? prefKey(st.preference) : '';
  if (lastPrefKey && key && key !== lastPrefKey) {
    st.stages.selector = 'idle'; st.stages.planner = 'idle';
    st.apis = []; st.tool_log = []; st.itinerary = null; st.itinerary_file = null;
  }
  if (key) lastPrefKey = key;
  $('chatBadge').textContent = st.complete ? '需求已收齐' : '收集需求中';
}

function prefKey(p) { return [p.city, p.days, p.travel_mode, p.atmosphere].join('|'); }

function renderStages() {
  for (const name of ['analyst', 'selector', 'planner']) {
    const el = $('stage-' + name);
    el.className = 'stage ' + (st.stages[name] || 'idle');
    el.querySelector('.dot').textContent = {done: '✓', error: '✗'}[st.stages[name]] || (
      name === 'analyst' ? '1' : name === 'selector' ? '2' : '3');
  }
  if (st.stages.analyst === 'done') $('detail-analyst').textContent = prefSummary();
}

function prefSummary() {
  const p = st.preference;
  if (!p || !p.city) return '已收齐';
  const d = p.start_date ? `（${p.start_date} 出发）` : '';
  return `${p.city} ${p.days}天${d} · ${p.travel_mode} · ${p.atmosphere}`;
}

function renderPlanBtn() {
  const btn = $('planBtn');
  const pipelineRunning = st.stages.planner === 'running' || st.stages.selector === 'running';
  btn.disabled = !st.complete || !!st.busy || pipelineRunning;
  btn.classList.toggle('ready', st.complete && !st.busy && !pipelineRunning && st.stages.planner !== 'done');
  btn.textContent = st.stages.planner === 'done' ? '重新规划' : '开始规划';
}

function renderApis() {
  if (!st.apis.length) { $('apiCard').classList.add('hidden'); return; }
  showCard('apiCard');
  $('apiCount').textContent = st.apis.length;
  const box = $('apiList');
  box.innerHTML = '';
  for (const a of st.apis) {
    const div = document.createElement('div');
    div.className = 'api-item';
    const head = document.createElement('div');
    head.innerHTML = `<span class="method">${a.method}</span><span class="path"></span> <span style="color:var(--muted)">${a.summary}</span>`;
    head.querySelector('.path').textContent = a.path;
    const purpose = document.createElement('div');
    purpose.className = 'purpose'; purpose.textContent = a.purpose;
    div.appendChild(head); div.appendChild(purpose);
    box.appendChild(div);
  }
}

function renderToolLog() {
  if (!st.tool_log.length) { $('toolCard').classList.add('hidden'); return; }
  showCard('toolCard');
  $('toolCount').textContent = st.tool_log.length;
  const box = $('toolLog');
  box.innerHTML = '';
  for (const t of st.tool_log) {
    const div = document.createElement('div');
    const name = document.createElement('span');
    name.className = 'tname'; name.textContent = t.name;
    div.appendChild(name);
    div.appendChild(document.createTextNode(' ' + (t.note || '')));
    box.appendChild(div);
  }
  box.scrollTop = box.scrollHeight;
}

function renderItinerary() {
  if (!st.itinerary) return;
  showCard('itiCard');
  $('itineraryStream').classList.add('hidden');
  $('itineraryBody').innerHTML = renderMD(st.itinerary);
}

function showCard(id) { $(id).classList.remove('hidden'); }

let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

// ---------- 迷你 markdown 渲染（行程格式：#/##/-/**） ----------
function renderMD(md) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const line of String(md).split(/\r?\n/)) {
    if (/^###\s/.test(line)) { closeList(); html += `<h3>${inline(line.slice(4))}</h3>`; }
    else if (/^##\s/.test(line)) { closeList(); html += `<h2>${inline(line.slice(3))}</h2>`; }
    else if (/^#\s/.test(line)) { closeList(); html += `<h1>${inline(line.slice(2))}</h1>`; }
    else if (/^[-*]\s/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
    }
    else if (line.trim() === '') { closeList(); }
    else { closeList(); html += `<p>${inline(line)}</p>`; }
  }
  closeList();
  return html;
}
